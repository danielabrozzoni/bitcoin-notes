<svg xmlns="http://www.w3.org/2000/svg" width="820" height="140" viewBox="0 0 820 140" role="img" aria-label="Right after loadtxoutset the tip is the snapshot base block, which has neither block data nor undo data. Block and undo data exist only up to START_HEIGHT; the heights in between are known as headers only.">
  <style>
    svg { color: #1f2328; }
    @media (prefers-color-scheme: dark) { svg { color: #e6edf3; } }
  </style>
  <text x="310" y="26" text-anchor="middle" class="d-label" fill="currentColor" font-family="ui-monospace, monospace" font-size="11.5">START_HEIGHT</text>
  <text x="536" y="26" text-anchor="middle" class="d-alarm-t" fill="#cf8420" font-family="ui-monospace, monospace" font-size="11.5">SNAPSHOT_BASE_HEIGHT</text>

  <line x1="310" y1="34" x2="310" y2="52" class="d-tick" stroke="currentColor" stroke-opacity=".3"></line>
  <line x1="536" y1="34" x2="536" y2="52" stroke="#cf8420" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity=".85"></line>

  <rect x="60" y="56" width="250" height="40" rx="6" class="d-ver" fill="#2f90cf" fill-opacity=".15" stroke="#2f90cf"></rect>
  <text x="185" y="81" text-anchor="middle" class="d-sub" fill="currentColor" opacity=".62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">block + undo data</text>

  <rect x="314" y="56" width="190" height="40" rx="6" class="d-box-sunk" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".28" stroke-dasharray="4 3"></rect>
  <text x="409" y="81" text-anchor="middle" class="d-sub" fill="currentColor" opacity=".62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">headers only</text>

  <rect x="508" y="56" width="56" height="40" rx="4" class="d-alarm-o" fill="none" stroke="#cf8420" stroke-width="1.3" stroke-dasharray="3 2"></rect>
  <text x="536" y="81" text-anchor="middle" class="d-alarm-t" fill="#cf8420" font-family="ui-monospace, monospace" font-size="11.5">tip</text>

  <rect x="568" y="56" width="190" height="40" rx="6" class="d-box-sunk" fill="currentColor" fill-opacity=".03" stroke="currentColor" stroke-opacity=".14" stroke-dasharray="4 3"></rect>
  <text x="663" y="81" text-anchor="middle" class="d-sub" fill="currentColor" opacity=".4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">no headers yet</text>

  <line x1="536" y1="100" x2="536" y2="110" stroke="#cf8420" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity=".85"></line>
  <text x="536" y="126" text-anchor="middle" class="d-sub" fill="currentColor" opacity=".62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">no block data, no undo data</text>
</svg>
